<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up Verification</title>

  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dezoqbzim/image/upload/v1768668000/image_16_udh8fu.png">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@100..900&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <!-- Tailwind -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="font-[Inter] relative min-h-screen">

  <!-- Overlay -->
  <div class="absolute inset-0 bg-black/10"></div>

  <!-- Content -->
  <div class="relative z-10 min-h-screen flex flex-col px-4 sm:px-6 lg:px-8">

    <!-- Logo -->
    <div class="flex justify-center pt-6 sm:pt-8">
      <img 
        src="https://res.cloudinary.com/dezoqbzim/image/upload/v1769111476/image_15_jdtso8.png"
        alt="Logo"
        class="h-12 sm:h-16 md:h-20 lg:h-24 w-auto"
      />
    </div>

    <!-- Message -->
    <div class="mx-auto mt-8 sm:mt-12 md:mt-16 shadow shadow-gray-500 rounded-[5px] p-4 sm:p-6 md:p-8 text-center w-full max-w-[90%] sm:max-w-md md:max-w-lg lg:max-w-[640px] bg-white">

      <h2 class="font-semibold font-[Saira] text-2xl sm:text-3xl md:text-[34px] mb-3 sm:mb-4 leading-tight">
        Verify Your Email
      </h2>

      <p class="mb-6 sm:mb-8 md:mb-10 text-xs sm:text-sm md:text-base px-2">
        We've sent a verification link to your email address. Please verify your account to continue.
      </p>

      <p class="text-orange-600 mb-6 sm:mb-8 text-xs sm:text-sm md:text-base px-2">
        Didn't receive the email? Check your spam folder.
      </p>

      <!-- Buttons -->
      <div class="space-y-3 sm:space-y-4">
        <a href="Signin.html" class="block">
          <button
            type="button"
            class="w-full sm:w-auto sm:px-8 md:px-12 lg:px-16 h-12 sm:h-14 bg-blue-950 text-white rounded-md font-medium 
                   hover:bg-blue-900 transition cursor-pointer text-sm sm:text-base"
          >
            Resend Verification Email
          </button>
        </a>

        <a href="index.html" class="block">
          <button 
            class="w-full sm:w-auto sm:px-8 md:px-12 lg:px-16 h-12 sm:h-14 bg-blue-950 text-white rounded-md font-medium 
                   hover:bg-blue-900 transition cursor-pointer text-sm sm:text-base"
          >
            Home
          </button>
        </a>
      </div>

    </div>
  </div>

</body>
</html>
